name: Bug report
description: Something in TRACEFIELD misbehaved
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **sanitize** any output you paste:
        remove real names, credentials, case content, and file paths from
        your home directory.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.1.0 or git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, install method (pipx/venv)"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: The full command line, with a scratch TRACEFIELD_HOME if possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Exit code, stdout, stderr. Say if a traceback was printed.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues for duplicates
        - label: I reproduced this with a fresh TRACEFIELD_HOME
        - label: No real investigation data or secrets are included in this report
