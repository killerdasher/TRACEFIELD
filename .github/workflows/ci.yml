name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Ruff lint
        run: ruff check src tests

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: mypy src

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The only adapter with integration_state=integrated ("exiftool-meta")
      # needs a REAL local backend for its end-to-end test; without this the
      # adapter E2E silently skips and CI never exercises it (run
      # 39967712054 had exactly 3 skips: unit ready-probe + 2 E2E-adjacent).
      # tesseract/ffprobe stay absent on purpose: both adapters are honest
      # spec-only, and their UNAVAILABLE paths are tested without them.
      - name: Install exiftool (backend for the integrated adapter E2E)
        run: sudo apt-get update -q && sudo apt-get install -y -q libimage-exiftool-perl
      - run: python -m pip install -e ".[dev]"
      - name: Unit + integration + security tests
        # Network-marked tests are opt-in only and never run in CI.
        run: pytest -m "not network" --cov=tracefield --cov-report=term-missing
      - name: Catalogue validation
        run: tracefield catalog validate

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" pip-audit
      - name: pip-audit (known vulnerabilities)
        # tracefield itself is editable from this repo (not on PyPI); audit
        # every resolved dependency instead of the local package.
        run: |
          pip freeze | grep -iv tracefield > /tmp/audit-reqs.txt
          pip-audit --strict -r /tmp/audit-reqs.txt
