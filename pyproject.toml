[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tracefield"
version = "0.1.0"
description = "Terminal-first OSINT field workbench with rigorous evidence provenance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "TRACEFIELD contributors" }]
keywords = ["osint", "cli", "tui", "evidence", "provenance", "investigation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.15,<0.28",
  "click>=8.1,<9",
  "rich>=13.9,<16",
  "textual>=8.2,<9",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5",
  "pytest-mock>=3.14",
  "ruff>=0.16,<1",
  "mypy>=1.20,<2",
]

[project.scripts]
tracefield = "tracefield.cli.main:run"

[project.urls]
Homepage = "https://github.com/killerdasher/TRACEFIELD"
Documentation = "https://github.com/killerdasher/TRACEFIELD#readme"
Issues = "https://github.com/killerdasher/TRACEFIELD/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracefield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running tests",
  "network: requires live network (opt-in only)",
  "unit: fast isolated unit tests",
  "integration: integration tests",
  "security: security regression tests",
  "e2e: full synthetic demonstration workflow (§16)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# B008: `typer.Argument(...)`/`typer.Option(...)` in defaults is the
# documented Typer idiom, not a defect.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tracefield"]
mypy_path = "src"
